---
id: Caregiver Authorization Affidavit
continue button field: caregiver_authorization_affidavit_form_finalwithfields_intro
question: "Caregiver Authorization Affidavit"
subquestion: |2
  ### Before you start:
  - You must be at least 18 years old.
  - The child must live with you and must be under 18 years old.
  - Get important information: the child's name and the caregiver's identification.
  - Identification can be California Driver's License, Social Security Number, Medi-Cal ID, or Consular Card.
  - If you are a relative, this form allows you to approve full medical and dental care. If you are not a relative, it only covers school enrollment and school-related checkups.
  
  ### When you finish:
  - Sign the form.
  - Keep the original safe at home.
  - Make copies for the school and doctors.
  - If you and the child move to a new home together, you are still the caregiver—just fill out a new form with your new address. 
  If the child moves out of your home, this form is no longer valid.
  
  Use this form to enroll a child in school or get them medical care. It is only for use in California. The form does not need a parent’s signature, notary, or court filing.
---
id: "18 or Older"
question: "Are you 18 or older?"
fields:
  - "Are you 18 or older?": user_age
    datatype: yesnoradio
---
id: under 18 offramp
event: under_18_offramp
question: "You cannot use this form."
subquestion: |2
  You must be **at least 18 years old** to fill out this form.
  
  Because you answered that you are not 18 or older, you cannot use this form to enroll a child in school or get medical treatment.
  
  ### What can you do instead?
  * **Have an adult complete this form:** Another adult (18 or older) living in the home—such as a relative or guardian—can fill out this form for the child.
  * **Contact the School District Liaison:** Public school districts have liaisons who can help you with enrolling the child.
buttons:
  - "Start over": restart
---
# Screen asking if user is the parent or caregiver (asked right after name)
id: parent or caregiver role
question: "Are you the parent or the caregiver?"
fields:
  - "Select your role:": user_role_type
    datatype: radio
    choices:
      - "Parent or legal guardian": parent_guardian
      - "Caregiver": authorized_caregiver
---
# Screen asking if caregiver is a qualified relative
id: Minor Info1
question: "Are you related to the child?"
subquestion: |2
  Your relationship determines the kind of medical decisions you can make:
  
  - **Qualified relatives** can approve full medical and dental care.
  
  - **Non-relatives** can approve school enrollment and school-related medical checkups (like vaccines and school physicals).
fields:
  - label: Are you a relative of the child?
    field: users_is_relative_yes
    datatype: yesnoradio
    help: "Qualified relatives include a grandparent, aunt, uncle, brother, sister, stepbrother, stepsister, half-brother, half-sister, niece, nephew, or first cousin."
---
# Screen asking if caregiver notified parents
id: caregiver advised parents question
question: "Did you notify the parents?"
subquestion: "Have you told the parent or legal guardian that you are completing this form to get care for the child?"
fields:
  - Did you notify the parents?: caregiver_advised_parents
    datatype: yesnoradio
---
# Dedicated Screen for Caregiver ID Number (Required)
id: Caregiver ID Number
question: "Caregiver identification"
subquestion: |2
  Please select your identification document. Schools, doctors, and clinics use this number to verify who is signing the form.
fields:
  - "Select your identification document:": caregiver_id_type
    datatype: dropdown
    choices:
      - "California driver's license (CDL)": cdl
      - "California state ID card": ca_id
      - "Consular identification card (Matrícula Consular)": consular
      - "Medi-Cal identification card": medical
      - "Social Security number (SSN)": ssn
  - "California driver's license number (8 characters):": caregiver_cdl_number
    show if:
      variable: caregiver_id_type
      is: cdl
    hint: "1 letter followed by 7 digits (e.g., D1234567)"
    maxlength: 8
  - "California state ID card number (8 characters):": caregiver_ca_id_number
    show if:
      variable: caregiver_id_type
      is: ca_id
    hint: "1 letter followed by 7 digits (e.g., I1234567)"
    maxlength: 8
  - "Consular identification card number (up to 12 characters):": caregiver_consular_number
    show if:
      variable: caregiver_id_type
      is: consular
    hint: "Consular card number (e.g., MC12345678)"
    maxlength: 12
  - "Medi-Cal identification number (9 characters):": caregiver_medical_number
    show if:
      variable: caregiver_id_type
      is: medical
    hint: "9 alphanumeric characters (e.g., 98765432A)"
    maxlength: 9
  - "Social Security number (9 digits):": caregiver_ssn_number
    show if:
      variable: caregiver_id_type
      is: ssn
    hint: "9 digits (XXX-XX-XXXX)"
    datatype: ssn
    maxlength: 11
---
# Code block to format users1_id_number from the selected ID dropdown
code: |
  if caregiver_id_type == 'cdl':
    users1_id_number = f"California Driver's License (CDL) #{caregiver_cdl_number.strip().upper()}"
  elif caregiver_id_type == 'ca_id':
    users1_id_number = f"California State ID Card #{caregiver_ca_id_number.strip().upper()}"
  elif caregiver_id_type == 'consular':
    users1_id_number = f"Consular Identification Card (Matrícula Consular) #{caregiver_consular_number.strip().upper()}"
  elif caregiver_id_type == 'medical':
    users1_id_number = f"Medi-Cal Identification Card #{caregiver_medical_number.strip().upper()}"
  elif caregiver_id_type == 'ssn':
    users1_id_number = f"Social Security Number (SSN): {caregiver_ssn_number.strip()}"
  else:
    users1_id_number = ""
---
# Off-ramp screen triggered when child is 18 years or older on the date the form is being filled
id: child too old offramp
event: child_too_old_offramp
question: |2
  ${childHeadline}
subquestion: |2
  Based on the date of birth you entered (${ children[0].birthdate.format() }), **${ children[0] }** is **${ int(children[0].age_in_years()) } years old** today.
  
  A Caregiver's Authorization Affidavit can **only** be used for a minor child under 18 years of age. Once a person turns 18, they are an adult and can make their own educational and medical decisions.
  
  ### Why you cannot use this form:
  * **Adult Status:** An individual 18 or older has full legal authority to enroll themselves in school, consent to their own medical and dental care, and sign documents.
  * **Form Not Valid for Adults:** Schools and medical clinics cannot accept a caregiver affidavit for an adult.
  
  ### What you can do instead:
  * **Self-Enrollment & Consent:** The young adult can enroll themselves in school or approve their own medical care.
  * **Healthcare Power of Attorney:** If they want your help making medical decisions, they can complete an Advance Health Care Directive or Medical Power of Attorney.
  * **Educational Permission / FERPA:** They can sign a school permission form authorizing the school to speak with you.
buttons:
  - "Change child's birthdate": children[0].birthdate
  - "Exit to Alliance for Children's Rights": exit
    url: https://allianceforchildrensrights.org/resources/caregivers-affidavit/
  - "Start over": restart
---
id: users names
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix
question: |
  % if i == 0 and al_person_answering == "user":
  What is your name?
  % elif al_form_type in ['starts_case', 'existing_case', 'appeal']:
  Who is the ${ ordinal(i) } person on your side of the case?
  % else:
  What is the name of the ${ ordinal(i) } person who is adding their
  name to this form with you?
  % endif
fields:
  - code: |
      users[i].name_fields()
---
# Dedicated screen for birthdate placed right after asking name
id: user birthdate
question: "When were you born?"
fields:
  - "Date of birth": users[0].birthdate
    datatype: date
---
# Question Library Address Question (connected with Google Maps API autocomplete)
id: caregiver address
question: |
  % if user_role_type == 'authorized_caregiver':
  What is your address?
  % else:
  What is the caregiver's address?
  % endif
subquestion: |2
  % if user_role_type == 'authorized_caregiver':
  Enter the address where you and the child live together.
  % else:
  Enter the address where the caregiver and the child will live together.
  % endif
fields:
  - code: |
      users[0].address_fields()
sets:
  - "users[0].address.address"
  - "users[0].address.city"
  - "users[0].address.zip"
  - "users[0].address.unit"
  - "users[0].address.state"
  - "users[0].address.country"
---
id: children names
sets:
  - children[i].name.first
  - children[i].name.last
  - children[i].name.middle
  - children[i].name.suffix
question: |
  % if hasattr(children, 'ask_number') and children.ask_number and children.target_number == 1:
  Name of child
  % else:
  Name of the ${ ordinal(i) } child
  % endif
fields:
  - code: |
      children[i].name_fields()
---
id: preview caregiver_authorization_affidavit_form_finalwithfields
question: |
  Preview your form before you sign it
subquestion: |2
  Here is a preview of the official California Caregiver's Authorization Affidavit you will sign on the next page. The signature date is automatically recorded as today (${ users1_signature_date.format() }).
  
  
  ${ caregiver_authorization_affidavit_form_finalwithfields_attachment.as_pdf(key='preview') }
  
  Open the form preview in a new tab. Use the "Edit answers" button to edit your answers.
  
  ${ action_button_html(url_action('review_caregiver_authorization_affidavit_form_finalwithfields'), label=word('Edit answers'), color='info') }
  
  Return to this interview tab to continue and sign your form.
continue button field: caregiver_authorization_affidavit_form_finalwithfields_preview_question
---
code: |
  signature_fields = ['users[0].signature']
---
code: |
  [user.address.address for user in users.complete_elements()]
  addresses_to_search = [user.address for user in users.complete_elements()]
---
id: caregiver authorization affidavit form finalwithfields review screen
event: review_caregiver_authorization_affidavit_form_finalwithfields
question: |
  Review your answers
review:
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: user_role_type
    button: |
      **Role & Parental Notification (Item 6)**

      Role: ${ 'Parent or legal guardian' if user_role_type == 'parent_guardian' else 'Caregiver' }

      % if user_role_type == 'parent_guardian':
      Parents notified: Yes (automatically marked because you are the parent)
      % else:
      Contacted parents: ${ word(yesno(caregiver_advised_parents)) if defined('caregiver_advised_parents') else '' }
      % endif
  - Edit: users[0].address.address
    button: |
      **${ "Your Home Address" if user_role_type == "authorized_caregiver" else "Caregiver's Home Address" }**

      Full address: ${ users[0].address.on_one_line() if defined('users[0].address.address') else showifdef('users1_address_full') }
  - Edit: caregiver_id_type
    button: |
      **Caregiver Identification (Item 8)**

      Caregiver's ID: ${ showifdef('users1_id_number') }
  - Edit: users_is_relative_yes
    button: |
      **Relationship to Child (Item 5)**

      % if user_role_type == 'parent_guardian':
      Related to child: Yes (automatically qualified as parent)
      % else:
      Caregiver is a qualified relative: ${ word(yesno(users_is_relative_yes)) if defined('users_is_relative_yes') else '' }
      % endif
  - Edit: children.revisit
    button: |
      **Children**

      % for item in children:
        * ${ item }
      % endfor

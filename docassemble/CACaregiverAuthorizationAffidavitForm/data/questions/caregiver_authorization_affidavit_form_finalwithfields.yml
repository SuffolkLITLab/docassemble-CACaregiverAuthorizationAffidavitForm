---
metadata:
  title: >-
    California Caregiver Authorization Affidavit
  short title: >-
    Caregiver Authorization
  description: |-
    This affidavit allows adult caregivers to enroll a child in school and approve medical care. Qualified relative caregivers can approve full medical, dental, and mental health care. Non-relative caregivers can approve school enrollment and school-related medical checkups (like vaccines and school physicals).
  can_I_use_this_form: |
    You can use this form if you are an adult caring for a child who lives with you in California. It does NOT require a parent's signature, notary, or court filing.
  before_you_start: |
    ### Before you get started
    - You must be at least 18 years old and the child must live with you.
    - The child must be under 18 years old on the date this form is completed.
    - Have your identification ready (California Driver's License, California State ID, Consular Card, Medi-Cal ID, or Social Security Number).
    - If you are a relative (like a grandparent, aunt, uncle, or adult brother or sister), this form allows you to approve full medical and dental care. If you are not a relative, it covers school enrollment and school-related checkups.

    ### When you are finished
    - Sign and date the form (the signature date is automatically filled as today).
    - Keep the signed original safe at home.
    - Give a copy to the school and another copy to doctors or clinics. Do NOT file this in court.
  when_you_are_finished: |
    Keep the signed original in a safe place at home. Give copies to the child's school and healthcare providers. Do NOT file this form with the court.
  efiling_enabled: False
  integrated_efiling: False
  integrated_email_filing: False
  requires_notarization: False
  unlisted: False
  landing_page_url: >-
    https://allianceforchildrensrights.org/resources/caregivers-affidavit/
  maturity: production
  estimated_completion_minutes: "8"
  estimated_completion_delta: "3"
  LIST_topics:
    - "CO-00-00-00-00"
  tags:
    - "CO-00-00-00-00"
  authors:
    - Court Forms Online
  original_form: []
  original_form_published_on: ""
  allowed_courts: []
  typical_role: "unknown"
  al_weaver_version: "2.3.1"
  generated_on: "2026-11-08"
  languages:
    - en
  jurisdiction: "NAM-US-US+CA"
  review_date: 2026-11-08
  form_titles:
    - California Caregiver Authorization Affidavit Form
  form_numbers: []
  update_notes: "Updated: (1) Added plain-language medical scope distinguishing relatives (full care) from non-relatives (school-related care); (2) Added clear moving instructions distinguishing moving together from child moving out; (3) Clean parent notification questions; (4) Retained required identification options."

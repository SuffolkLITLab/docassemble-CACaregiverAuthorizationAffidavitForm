---
id: Caregiver Authorization Affidavit
continue button field: caregiver_authorization_affidavit_form_finalwithfields_intro
question: "Caregiver Authorization Affidavit"
subquestion: |2
  ### Before you start:
  - Make sure you are at least 18 years old and the child lives with you.
  - Get important information, like the child's name and your identification.
  - Try to contact the parent(s), if possible, to let them know you are filling out this form.
  
  ### When you finish:
  - Sign the form (the date is automatically set to today).
  - Keep the original safe at home.
  - Make copies for the school and doctors.
  
  Use this form to enroll a child in school or get them medical care. It is only for use in California. The form does not need a parent’s signature, notary, or court filing.
---
id: "18 or Older"
question: "Are you 18 or older?"
fields:
  - Are you 18 or older?: user_age
    datatype: yesnoradio
subquestion: "You must be 18 or older to fill in this form."
---
id: under 18 offramp
event: under_18_offramp
question: |
  You cannot use this form
subquestion: |2
  Under **California Family Code § 6550**, only an adult caregiver who is **at least 18 years of age** can complete a Caregiver's Authorization Affidavit.
  
  Because you answered that you are not 18 or older, you cannot use this form to enroll a child in school or get medical treatment.
  
  ### What can you do instead?
  * **Have an adult complete this form:** Another adult (18 or older) living in the home—such as a relative, guardian, or other responsible adult—can fill out this form on behalf of the child.
  * **Contact Legal Assistance:** For guidance regarding guardianship, caregiver rights, or legal options, visit [Alliance for Children's Rights](https://allianceforchildrensrights.org/resources/caregivers-affidavit/).
  * **Contact the School District Liaison:** Under California Education Code § 48204, public school districts have designated liaisons who can help you with enrolling the child.
buttons:
  - Exit to Alliance for Children's Rights: exit
    url: https://allianceforchildrensrights.org/resources/caregivers-affidavit/
  - Start over: restart
---
id: users names
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix
question: |
  % if i == 0 and al_person_answering == "user":
  What is your name?
  % elif al_form_type in ['starts_case', 'existing_case', 'appeal']:
  Who is the ${ ordinal(i) } person on your side of the case?
  % else:
  What is the name of the ${ ordinal(i) } person who is adding their
  name to this form with you?
  % endif
fields:
  - code: |
      users[i].name_fields()
---
# Question Library Address Question (connected with Google Maps API autocomplete)
id: caregiver address
question: |
  What is your home address?
subquestion: |2
  Enter the California address where you and the child currently live. As you start typing, Google Maps will suggest verified matching addresses.
fields:
  - code: |
      users[0].address_fields()
sets:
  - "users[0].address.address"
  - "users[0].address.city"
  - "users[0].address.zip"
  - "users[0].address.unit"
  - "users[0].address.state"
  - "users[0].address.country"
---
# Separate Dedicated Screen for Caregiver ID Number with full legal purpose description
id: Caregiver ID Number
question: "Caregiver identification"
subquestion: |2
  ### Why is this identification needed?
  Under **California Family Code § 6552 (Item 8)**, you must give an ID number to have a valid Caregiver's Authorization Affidavit.
  
  **What this ID is used for:**
  - **Identity Verification:** Schools, doctors, dentists, and clinics use this number to verify that you are the specific adult signing this form.
  - **Fraud Prevention:** It confirms who you are without requiring a notary public or court clerk verification.
  
  You may use any **one** of the following:
  - California Driver's License (CDL)
  - California State ID Card
  - Consular Identification Card (Matrícula Consular)
  - Medi-Cal Identification Card
  - Social Security Number (SSN)
fields:
  - label: "Identification Type & Number"
    field: users1_id_number
    hint: "e.g., CA Driver's License #D1234567 or Medi-Cal #..."
---
id: Minor Information
question: "Have you told the parents about filling out this form?"
subquestion: "Did you tell the parents "
fields:
  - I spoke with one of the parents.: users_advised_parents_yes
    datatype: yesno
  - I was not able to reach either of them.: users_unable_to_contact_parents_yes
    datatype: yesno
---
comment: |
  The questions below are copies of the questions in AssemblyLine's
  ql_baseline.yml, rewritten to name this interview's own objects instead of the
  generic `x`. Edit them freely: they replace the AssemblyLine versions. Delete
  one to go back to the AssemblyLine wording.
---
id: Minor Info1
question: "Child's information"
fields:
  - Are you related to the child?: users_is_relative_yes
    datatype: yesnoradio
---
id: children names
sets:
  - children[i].name.first
  - children[i].name.last
  - children[i].name.middle
  - children[i].name.suffix
question: |
  % if hasattr(children, 'ask_number') and children.ask_number and children.target_number == 1:
  Name of child
  % else:
  Name of the ${ ordinal(i) } child
  % endif
fields:
  - code: |
      children[i].name_fields()
---
id: preview caregiver_authorization_affidavit_form_finalwithfields
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page. The signature date is automatically recorded as today (${ users1_signature_date.format() }).

  ${ al_user_bundle.as_pdf(key='preview') }

  Open the form preview in a new tab. Use the "Edit answers" button to edit your
  answers.

  ${ action_button_html(url_action('review_caregiver_authorization_affidavit_form_finalwithfields'), label=word('Edit answers'), color='info') }

  Return to this interview tab to continue and sign your form.
continue button field: caregiver_authorization_affidavit_form_finalwithfields_preview_question
---
code: |
  signature_fields = ['users[0].signature']
---
code: |
  # This is a placeholder for the addresses that will be searched
  # for matching address to court. Edit if court venue is based on
  # a different address than the user's
  [user.address.address for user in users.complete_elements()]
  addresses_to_search = [user.address for user in users.complete_elements()]
---
id: caregiver authorization affidavit form finalwithfields review screen
event: review_caregiver_authorization_affidavit_form_finalwithfields
question: |
  Review your answers
review:
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: users[0].address.address
    button: |
      **Caregiver Home Address (Google Maps Verified)**

      Full address: ${ users[0].address.on_one_line() if defined('users[0].address.address') else showifdef('users1_address_full') }
  - Edit: users1_id_number
    button: |
      **Caregiver Identification Number**

      Caregiver's ID or license number: ${ showifdef('users1_id_number') }
  - Edit: users_is_relative_yes
    button: |
      **Minor Information**

      Caregiver is a relative of minor: ${ word(yesno(users_is_relative_yes)) if defined('users_is_relative_yes') else '' }

      Caregiver advised legal guardians: ${ word(yesno(users_advised_parents_yes)) if defined('users_advised_parents_yes') else '' }

      Caregiver unable to contact guardians: ${ word(yesno(users_unable_to_contact_parents_yes)) if defined('users_unable_to_contact_parents_yes') else '' }
  - Edit: children.revisit
    button: |
      **Children**

      % for item in children:
        * ${ item }
      % endfor
---
id: edit users
continue button field: users.revisit
question: |
  Edit users
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
table: users.table
rows: users
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Birthdate: |
      row_item.birthdate if defined("row_item.birthdate") else ""
  - Signature: |
      row_item.signature if defined("row_item.signature") else ""
edit:
  - name.first
  - birthdate
confirm: True
---
id: edit children
continue button field: children.revisit
question: |
  Edit children
subquestion: |
  ${ children.table }

  ${ children.add_action() }
---
table: children.table
rows: children
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Birthdate: |
      row_item.birthdate if defined("row_item.birthdate") else ""
edit:
  - name.first
  - birthdate
confirm: True
---
id: download caregiver_authorization_affidavit_form_finalwithfields
event: caregiver_authorization_affidavit_form_finalwithfields_download
question: |2
  Your Caregiver Affidavit is Ready!
subquestion: |2
  Thank you, ${users[0]}. Your official California Caregiver Authorization Affidavit has been generated.
  
  ### What you need to do next:
  1. **Print & Keep the Original:** Keep the signed original document in a safe place at home. This affidavit is valid for **one year** from today (${ users1_signature_date.format() }).
  2. **Give a Copy to the School:** Give a copy to the child's school principal, registrar, or district office.
  3. **Give a Copy to Healthcare Providers:** Give a copy to doctors, dentists, or clinics when needing medical care for the child.
  4. **Do NOT File with the Court:** This affidavit does NOT require notarization, a court hearing, or court filing.
  5. **If Living Arrangements Change:** If the child stops living with you, immediately tell the school and healthcare providers.
  
  Use the options below to download your affidavit and your Next Steps instruction guide.
  
  ${ action_button_html(url_action('review_caregiver_authorization_affidavit_form_finalwithfields'), label=word('Edit answers'), color='info') }
  
  ${ al_user_bundle.download_list_html() }
  
  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }
progress: 100
---

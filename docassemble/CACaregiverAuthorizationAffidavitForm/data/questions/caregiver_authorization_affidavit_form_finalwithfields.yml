  al_next_steps_what_happens_next = """1. Print and sign the completed affidavit.
  2. Keep the signed original in a safe place at home. Give copies to the school and doctors.
  3. School Enrollment: Give a copy to the child's school for enrollment.
  4. Medical and Dental Care:
     - Qualified Relatives: If you are a qualified relative (grandparent, aunt, uncle, adult brother or sister, etc.), you can consent to full medical, dental, and mental health care.
     - Non-Relative Caregivers: If you are not a relative, you can consent to school-related medical care (like vaccines and school physicals).
  5. What happens if you move:
     - Moving together to a new home: You are still the caregiver. Just fill out a new form with your new address and give copies to the school and clinic.
     - Child moves out of your home: This form is no longer valid. Tell the school and doctors right away.

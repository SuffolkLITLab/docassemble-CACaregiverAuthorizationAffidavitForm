---
id: caregiver purpose
question: How will the caregiver use this form?
subquestion: |
  School-related medical care includes vaccinations and exams required for school
  enrollment or participation in school activities.
fields:
  - no label: caregiver_purpose
    datatype: radio
    choices:
      - School enrollment and school-related medical care: school
      - Medical or dental care beyond school requirements: medical
---
id: nonrelative medical section
question: The additional medical section is for relatives
subquestion: |
  A caregiver who is not a relative can use this affidavit for school enrollment
  and school-related medical care. The additional section for other medical and
  dental care is for relative caregivers.
fields:
  - What would you like to do?: nonrelative_choice
    datatype: radio
    choices:
      - Prepare the school-related version: school
      - Review the relationship answer: review
      - Read about other caregiving options: options
---
id: medical contact incomplete
question: Item 6 has not been completed
subquestion: |
  Neither statement in item 6 was selected. The additional medical section is not
  complete with these answers. Do not select a statement unless it is true.

  If someone with legal custody has objected, this affidavit does not resolve that
  disagreement. Read about other options or get legal help before relying on it
  for that medical decision.
fields:
  - What would you like to do?: contact_incomplete_choice
    datatype: radio
    choices:
      - Prepare the school-related version: school
      - Review the item 6 answers: review
      - Read about other caregiving options: options
---
id: medical identification unavailable
question: Item 8 has not been completed
subquestion: |
  An identification number is needed to complete the additional medical section.
  You can still prepare the school-related version without entering one.
fields:
  - What would you like to do?: id_unavailable_choice
    datatype: radio
    choices:
      - Prepare the school-related version: school
      - Review the identification choices: review
      - Read about other caregiving options: options
---
id: other caregiving options
event: caregiver_medical_options
question: Other caregiving options
subquestion: |
  [California Courts explains other options for caring for a child](https://selfhelp.courts.ca.gov/guardianship/other-options).
  The [Alliance for Children's Rights](https://allianceforchildrensrights.org/resources/caregivers-affidavit/)
  also has information about caregiver affidavits.

  A caregiver affidavit does not change the parents' or legal guardians' rights.
  Get legal help if there is a disagreement about the child's care.
buttons:
  - Start over: restart
  - Exit: exit
---
id: caregiver signing method
question: How will the caregiver sign the affidavit?
fields:
  - no label: caregiver_signing_method
    datatype: radio
    choices:
      - Print and sign on paper: paper
      - Sign electronically: electronic
---
id: caregiver signing date
question: What signing date should appear on the affidavit?
subquestion: |
  Use the actual signing date. If it changes, update the date before signing.
fields:
  - Signing date: signature_date
    datatype: date
    default: ${ today() }
---
id: caregiver signing screen
continue button field: caregiver_signing_screen
question: The caregiver must review and sign
subquestion: |
  ${ users[0] } must review the affidavit and complete the signature on the next screens.
  If you are helping, let the caregiver review the form and sign it.

---
# Recheck eligibility before both the main flow and the review event.
only sets: caregiver_medical_requirements
code: |
  caregiver_purpose
  if caregiver_purpose == 'medical':
    users_is_relative_yes
    if not users_is_relative_yes:
      nonrelative_choice
      if nonrelative_choice == 'school':
        caregiver_purpose = 'school'
        undefine('nonrelative_choice')
      elif nonrelative_choice == 'review':
        undefine('nonrelative_choice')
        force_ask('users_is_relative_yes')
      else:
        caregiver_medical_options
  if caregiver_purpose == 'medical':
    users_advised_parents_yes
    users_unable_to_contact_parents_yes
    if not (users_advised_parents_yes or users_unable_to_contact_parents_yes):
      contact_incomplete_choice
      if contact_incomplete_choice == 'school':
        caregiver_purpose = 'school'
        undefine('contact_incomplete_choice')
      elif contact_incomplete_choice == 'review':
        undefine('contact_incomplete_choice')
        force_ask('users_advised_parents_yes')
      else:
        caregiver_medical_options
  if caregiver_purpose == 'medical':
    users[0].birthdate
    caregiver_id_type
    if caregiver_id_type == 'unavailable':
      id_unavailable_choice
      if id_unavailable_choice == 'school':
        caregiver_purpose = 'school'
        undefine('id_unavailable_choice')
      elif id_unavailable_choice == 'review':
        undefine('id_unavailable_choice')
        force_ask('caregiver_id_type')
      else:
        caregiver_medical_options
  if caregiver_purpose == 'medical':
    users1_id_number
  caregiver_medical_requirements = True

---
reset:
  - caregiver_medical_requirements
---
# Recompute from current answers, including when editing within the review event.
reconsider: True
code: |
  if caregiver_purpose == 'medical':
    if caregiver_id_type == 'cdl':
      users1_id_number = "California Driver's License (CDL) #" + caregiver_cdl_number.strip().upper()
    elif caregiver_id_type == 'ca_id':
      users1_id_number = 'California State ID Card #' + caregiver_ca_id_number.strip().upper()
    elif caregiver_id_type == 'consular':
      users1_id_number = 'Consular Identification Card #' + caregiver_consular_number.strip().upper()
    elif caregiver_id_type == 'medical':
      users1_id_number = 'Medi-Cal Identification Card #' + caregiver_medical_number.strip().upper()
    elif caregiver_id_type == 'ssn':
      users1_id_number = 'Social Security Number: ' + caregiver_ssn_number.strip()
    else:
      users1_id_number = ''
  else:
    users1_id_number = ''

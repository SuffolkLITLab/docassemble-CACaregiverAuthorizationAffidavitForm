  - caregiver_authorization_affidavit_form_finalwithfields_attachment: ALDocument.using(filename="caregiver_authorization_affidavit_form_finalwithfields", enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads for caregiver records, school, and doctors
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[caregiver_authorization_affidavit_form_finalwithfields_Post_interview_instructions, caregiver_authorization_affidavit_form_finalwithfields_attachment], filename="caregiver_authorization_affidavit_packet", enabled=True)
  - al_provider_bundle: ALDocumentBundle.using(elements=[caregiver_authorization_affidavit_form_finalwithfields_attachment], filename="caregiver_affidavit_for_school_and_health_providers", enabled=True)

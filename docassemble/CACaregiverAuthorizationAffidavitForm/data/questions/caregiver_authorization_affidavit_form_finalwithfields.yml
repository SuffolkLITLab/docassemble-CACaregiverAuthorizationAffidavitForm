  Preview your form before you sign it
subquestion: |2
  Here is a preview of the official California Caregiver's Authorization Affidavit you will sign on the next page. The signature date is automatically recorded as today (${ users1_signature_date.format() }).
  
  
  ${ caregiver_authorization_affidavit_form_finalwithfields_attachment.as_pdf(key='preview') }
  
  Open the form preview in a new tab. Use the "Edit answers" button to edit your

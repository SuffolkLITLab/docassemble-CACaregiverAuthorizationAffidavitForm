id: interview_order_caregiver_authorization_affidavit_form_finalwithfields
code: |
  # 1. Ask caregiver age qualification gate
  user_age
  # If caregiver answered 'No' (user_age is False), trigger the caregiver off-ramp screen
  if not user_age:
    under_18_offramp
  nav.set_section('people')
  # 2. What is your name?
  users.gather()
  set_parts(subtitle=str(users))
  # 3. "When were you born?" screen comes right after asking "What is your name?"
  users[0].birthdate
  # 4. Ask whether they are the parent or the caregiver
  user_role_type
  # 5. Address question ("What is your address?" for caregiver, "What is the caregiver's address" for parent)
  users[0].address.address
  # Formats Question Library address into single-line string for PDF template
  users1_address_full = users[0].address.on_one_line()
  # 6. Dedicated standalone ID question screen with dynamic dropdown and tailored length textbox
  caregiver_id_type
  users1_id_number
  # 7. Caregiver relationship check: only asked if caregiver; automatically yes if parent
  if user_role_type == 'authorized_caregiver':
    users_is_relative_yes
  # 8. Parental notification question (Item 6):
  # If parent, skip the question and automatically mark it yes.
  # If caregiver, ask if they contacted the parents (single yes/no question).
  if user_role_type == 'authorized_caregiver':
    caregiver_advised_parents
  users_advised_parents_yes
  nav.set_section('case_details')
  set_progress(45)
  children.gather()
  # Gather child's birthdate
  children[0].birthdate
  # 9. Child age check: If child is 18 or older from the date the form is being filled, trigger off-ramp
  if children[0].age_in_years() >= 18:
    child_too_old_offramp

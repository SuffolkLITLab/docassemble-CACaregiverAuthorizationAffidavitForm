---
id: Caregiver Authorization Affidavit
continue button field: caregiver_authorization_affidavit_form_finalwithfields_intro
question: Caregiver's Authorization Affidavit
subquestion: |
  Use this form for a child under 18 who lives with an adult caregiver in California.
  The caregiver must be at least 18 years old.

  The form can be used for school enrollment and school-related medical care.
  A relative caregiver can also complete the additional section for other medical and dental care.

  If you are helping someone, enter the caregiver's information. The caregiver must
  review and sign the affidavit. A parent's signature, notarization, and court filing are not required.
---
id: "18 or Older"
question: |
  ${ 'Are you 18 or older?' if user_role_type == 'authorized_caregiver' else 'Is the caregiver 18 or older?' }
fields:
  - no label: user_age
    datatype: yesnoradio
---
id: under 18 offramp
event: under_18_offramp
question: The caregiver must be 18 or older
subquestion: |
  This affidavit is for an adult caregiver. Another adult who lives with the child may be able to use it.

  For help with school enrollment, contact the school district's liaison or
  [read about other caregiving options](https://selfhelp.courts.ca.gov/guardianship/other-options).
buttons:
  - Start over: restart
---
id: parent or caregiver role
question: Who is filling out this interview?
fields:
  - no label: user_role_type
    datatype: radio
    choices:
      - I am the caregiver: authorized_caregiver
      - I am helping the caregiver: helper
---
id: Minor Info1
question: |
  ${ 'Are you related to the child?' if user_role_type == 'authorized_caregiver' else 'Is the caregiver related to the child?' }
subquestion: |
  The additional medical section is for relative caregivers. Examples include grandparents,
  aunts, uncles, siblings, first cousins, and stepparents. See the full definition below.
fields:
  - Relative under the definition on this form: users_is_relative_yes
    datatype: yesnoradio
    help: |
      A relative is an adult related to the child by blood, adoption, or affinity (relationship through marriage) within
      the fifth degree of kinship. This includes stepparents, stepsiblings, relatives
      whose status is preceded by great, great-great, or grand, and spouses of those
      relatives, even if the marriage ended through death or divorce.
---
id: caregiver advised parents question
question: Which statements are true for the caregiver?
subquestion: |
  These are the statements in item 6 of the affidavit. Select a statement only if the
  whole statement is true. If you are helping, answer from the caregiver's point of view.

  Both statements can apply, for example, if one parent was notified and did not object,
  but the other parent cannot be reached. Not having contacted someone yet does not,
  by itself, mean they cannot be contacted.
fields:
  - I told the child's parents or legal custodians that I intend to authorize medical care, and I have received no objection.: users_advised_parents_yes
    datatype: yesno
  - I am unable to contact the child's parents or legal custodians right now to notify them that I intend to authorize medical care.: users_unable_to_contact_parents_yes
    datatype: yesno
---
# Identification for the additional medical section
id: Caregiver ID Number
question: "Caregiver identification"
subquestion: |2
  Item 8 of the additional medical section asks for the caregiver's identification number.
  If the caregiver does not have a California license, state ID, or consular card, the form allows
  another form of identification, such as a Medi-Cal or Social Security number.
fields:
  - "Select the caregiver's identification document:": caregiver_id_type
    datatype: dropdown
    choices:
      - "California driver's license (CDL)": cdl
      - "California state ID card": ca_id
      - "Consular identification card (Matrícula Consular)": consular
      - "Medi-Cal identification card": medical
      - "Social Security number (SSN)": ssn
      - "The caregiver does not have an identification number to enter": unavailable
  - "California driver's license number (8 characters):": caregiver_cdl_number
    show if:
      variable: caregiver_id_type
      is: cdl
    hint: "1 letter followed by 7 digits (e.g., D1234567)"
    maxlength: 8
  - "California state ID card number (8 characters):": caregiver_ca_id_number
    show if:
      variable: caregiver_id_type
      is: ca_id
    hint: "1 letter followed by 7 digits (e.g., I1234567)"
    maxlength: 8
  - "Consular identification card number:": caregiver_consular_number
    show if:
      variable: caregiver_id_type
      is: consular
    hint: "Consular card number (e.g., MC12345678)"
  - "Medi-Cal identification number (9 characters):": caregiver_medical_number
    show if:
      variable: caregiver_id_type
      is: medical
    hint: "9 alphanumeric characters (e.g., 98765432A)"
    maxlength: 9
  - "Social Security number (9 digits):": caregiver_ssn_number
    show if:
      variable: caregiver_id_type
      is: ssn
    hint: "9 digits (XXX-XX-XXXX)"
    datatype: ssn
    maxlength: 11
---
template: childHeadline
content: |
  You cannot use this form for a child who is 18 or older.
---
# Off-ramp screen triggered when child is 18 years or older on the date the form is being filled
id: child too old offramp
event: child_too_old_offramp
question: "You cannot use this form for a child who is 18 or older."
subquestion: |2-
  Based on the date of birth you entered (${ children[0].birthdate.format() }), **${ children[0] }** is **${ int(children[0].age_in_years()) } years old** today.
  
  A Caregiver's Authorization Affidavit can **only** be used for a minor child under 18 years of age. Once a person turns 18, they are an adult and can make their own educational and medical decisions.
buttons:
  [{"Start over":"restart"}]

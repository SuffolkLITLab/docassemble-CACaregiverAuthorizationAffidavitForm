---
id: Caregiver Authorization Affidavit
continue button field: caregiver_authorization_affidavit_form_finalwithfields_intro
question: "Caregiver Authorization Affidavit"
subquestion: |2
  ### Before you start:
  - You must be at least 18 years old.
  - The child must live with you and must be under 18 years old.
  - Get important information: the child's name and the caregiver's identification.
  - Identification can be: California Driver's License, Social Security Number, Med-Cal ID, or Consular Card.
  
  ### When you finish:
  - Sign the form.
  - Keep the original safe at home.
  - Make copies for the school and doctors.
  
  Use this form to enroll a child in school or get them medical care. It is only for use in California. The form does not need a parent’s signature, notary, or court filing.
---
id: "18 or Older"
question: "Are you 18 or older?"
fields:
  - Are you 18 or older?: user_age
    datatype: yesnoradio
---
id: under 18 offramp
event: under_18_offramp
question: "You cannot use this form."
subquestion: |2
  You must be **at least 18 years of age** to complete this form.
  
  Because you answered that you are not 18 or older, you cannot use this form to enroll a child in school or get medical treatment.
  
  ### What can you do instead?
  * **Have an adult complete this form:** Another adult (18 or older) living in the home—such as a relative, guardian, or other responsible adult—can fill out this form on behalf of the child.
  * **Contact the School District Liaison:** Public school districts have designated liaisons who can help you with enrolling the child.
buttons:
  [{"Start over":"restart"}]
---
# Screen asking if user is the Parent/Legal Guardian or Authorized Caregiver
id: parent or caregiver role
question: "Are you the parent/legal guardian or the caregiver being authorized?"
fields:
  - "Select your role:": user_role_type
    datatype: radio
    choices:
      - {"Parent/Legal Guardian":"parent_guardian"}
      - {"Caregiver being authorized":"authorized_caregiver"}
---
# Screen asking authorized caregiver if they contacted the parents using yes/no radio
id: authorized caregiver contacted parents
question: "Did you contact the parent(s)?"
subquestion: |2
  As an authorized caregiver, have you notified the minor's parent(s) or legal guardian(s) of your intent to authorize medical and dental care?
fields:
  - "Have you contacted the parents?": authorized_caregiver_contacted_parents_radio
    datatype: yesnoradio
---
# Off-ramp screen triggered when child is 18 years or older on the date the form is being filled
id: child too old offramp
event: child_too_old_offramp
question: |2
  This individual is not a minor (18 or older)
subquestion: |2-
  Based on the date of birth you entered (${ children[0].birthdate.format() }), **${ children[0] }** is **${ int(children[0].age_in_years()) } years old** today.
  
  This form can **only** be used for a **minor** (under 18 years of age). 
buttons:
  [{"Start over":"restart"}]
---
id: users names
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix
question: |
  % if i == 0 and al_person_answering == "user":
  What is your name?
  % elif al_form_type in ['starts_case', 'existing_case', 'appeal']:
  Who is the ${ ordinal(i) } person on your side of the case?
  % else:
  What is the name of the ${ ordinal(i) } person who is adding their
  name to this form with you?
  % endif
fields:
  - code: |
      users[i].name_fields()
---
# Question Library Address Question (connected with Google Maps API autocomplete)
id: caregiver address
question: |2
  What is the your home address?
subquestion: "Enter the address where the child lives."
fields:
  - code: |
      users[0].address_fields()
sets:
  - "users[0].address.address"
  - "users[0].address.city"
  - "users[0].address.zip"
  - "users[0].address.unit"
  - "users[0].address.state"
  - "users[0].address.country"
---
# Separate Dedicated Screen for Caregiver ID Number with dynamic dropdown and tailored character-length textbox
id: Caregiver ID Number
question: "Caregiver identification"
subquestion: |2
  ### Why is this identification needed?
  You must give an ID number to have a valid Caregiver's Authorization Affidavit.
  
  **What this ID is used for:**
  - **Identity Verification:** Schools, doctors, dentists, and clinics use this number to verify that you are the specific adult signing this form.
  - **Fraud Prevention:** It confirms who you are without requiring a notary public or court clerk verification.
fields:
  - "Select your identification document:": caregiver_id_type
    datatype: dropdown
    choices:
      - "California Driver’s License (CDL)": cdl
      - "California State ID Card": ca_id
      - "Consular Identification Card (Matrícula Consular)": consular
      - "Medi-Cal Identification Card": medical
      - "Social Security Number (SSN)": ssn
  - label: "California Driver's License Number (8 characters):"
    field: caregiver_cdl_number
    show if: {"is":"cdl","variable":"caregiver_id_type"}
    hint: "1 letter followed by 7 digits (e.g., D1234567)"
    maxlength: 8
  - label: "California State ID Card Number (8 characters):"
    field: caregiver_ca_id_number
    show if: {"is":"ca_id","variable":"caregiver_id_type"}
    hint: "1 letter followed by 7 digits (e.g., I1234567)"
    maxlength: 8
  - label: "Consular Identification Card Number (up to 12 characters):"
    field: caregiver_consular_number
    show if: {"is":"consular","variable":"caregiver_id_type"}
    hint: "Consular card number (e.g., MC12345678)"
    maxlength: 12
  - label: "Medi-Cal Identification Number (9 characters):"
    field: caregiver_medical_number
    show if: {"is":"medical","variable":"caregiver_id_type"}
    hint: "9 alphanumeric characters (e.g., 98765432A)"
    maxlength: 9
  - label: "Social Security Number (9 digits):"
    field: caregiver_ssn_number
    datatype: ssn
    show if: {"is":"ssn","variable":"caregiver_id_type"}
    hint: "9 digits (XXX-XX-XXXX)"
    maxlength: 11
---
# Code block to format users1_id_number from the selected ID dropdown and tailored value
code: |
  if caregiver_id_type == 'cdl':
    users1_id_number = f"California Driver's License (CDL) #{caregiver_cdl_number.strip().upper()}"
  elif caregiver_id_type == 'ca_id':
    users1_id_number = f"California State ID Card #{caregiver_ca_id_number.strip().upper()}"
  elif caregiver_id_type == 'consular':
    users1_id_number = f"Consular Identification Card (Matrícula Consular) #{caregiver_consular_number.strip().upper()}"
  elif caregiver_id_type == 'medical':
    users1_id_number = f"Medi-Cal Identification Card #{caregiver_medical_number.strip().upper()}"
  elif caregiver_id_type == 'ssn':
    users1_id_number = f"Social Security Number (SSN): {caregiver_ssn_number.strip()}"
  else:
    users1_id_number = ""
---
comment: |
  The questions below are copies of the questions in AssemblyLine's
  ql_baseline.yml, rewritten to name this interview's own objects instead of the
  generic `x`. Edit them freely: they replace the AssemblyLine versions. Delete
  one to go back to the AssemblyLine wording.

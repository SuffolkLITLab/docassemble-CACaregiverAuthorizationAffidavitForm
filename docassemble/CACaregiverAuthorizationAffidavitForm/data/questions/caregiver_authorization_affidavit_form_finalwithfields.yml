---
metadata:
  title: >-
    California Caregiver Authorization Affidavit
  short title: >-
    Caregiver Authorization
  description: |-
    This affidavit allows caregivers to enroll a minor in school and authorize medical and/or dental care. It's specifically for adults who are not the minor's parents or legal guardians.
  can_I_use_this_form: |
    You can use this form if you are caring for a minor and need to enroll them in school or consent to their medical and/or dental care. It's valid in California and does NOT require a parent’s signature, notary, or court filing.
  before_you_start: |
    ### Before you get started
    - Ensure you are at least 18 years old and the minor lives with you.
    - Gather necessary information like the minor's name and your identification.
    - The child must be under 18 years of age on the date this form is completed.

    ### When you are finished
    - Sign and date the affidavit (signature date is automatically filled as today).
    - Keep the original copy in a safe, accessible place at home.
    - Give a copy to the school and another copy to healthcare/dental providers.
  when_you_are_finished: |
    Keep the signed original in a safe place. Provide copies to the child's school and healthcare providers. Do NOT file this in court.

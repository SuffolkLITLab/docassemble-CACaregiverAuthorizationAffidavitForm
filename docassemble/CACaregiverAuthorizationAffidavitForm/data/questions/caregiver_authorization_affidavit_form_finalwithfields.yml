  - users: ALPeopleList.using(ask_number=True,target_number=1)
---
sections:
  - people: Caregiver Details
  - case_details: Child's Info
  - review_caregiver_authorization_affidavit_form_finalwithfields: Review your answers
---
#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_caregiver_authorization_affidavit_form_finalwithfields
code: |
  user_age
  if user_age < 18:
    pass
  user_ask_role
  nav.set_section('people')
  users.gather()
  set_parts(subtitle=str(users))
  users1_address_full
  users[0].birthdate
  users_is_relative_yes
  users_advised_parents_yes
  nav.set_section('case_details')
  set_progress(45)
  children.gather()
  children[0].birthdate
  interview_order_caregiver_authorization_affidavit_form_finalwithfields = True
---
###################### Main order ######################
comment: |
  This block includes the logic for standalone interviews.
  Delete mandatory: True to include in another interview
mandatory: True
code: |
  al_intro_screen
  caregiver_authorization_affidavit_form_finalwithfields_intro
  interview_order_caregiver_authorization_affidavit_form_finalwithfields
  signature_date
  # Store anonymous data for analytics / statistics
  store_variables_snapshot(
      persistent=True,
      data={
          "zip": showifdef("users[0].address.zip"),
          "reached_interview_end": True,
      },
  )
  caregiver_authorization_affidavit_form_finalwithfields_preview_question
  basic_questions_signature_flow
  set_progress(100)
  caregiver_authorization_affidavit_form_finalwithfields_download
---
id: Caregiver Authorization Affidavit Form final with fields intro
continue button field: caregiver_authorization_affidavit_form_finalwithfields_intro
question: "Caregiver Authorization Affidavit Form"
subquestion: |2
  ### Before you start:
  - Make sure you are at least 18 years old and the child lives with you.
  - Get important information, like the child's name and your ID.
  
  ### When you finish:
  - Sign the form.
  - Make copies for the school and doctors.
  
  Use this form to enroll a child in school or get them medical care. It is only for use in California and does not need a parent’s signature.
---
id: "18 or Older"
question: "Are you 18 or older?"
fields:
  - Are you 18 or older?: user_age
    datatype: yesnoradio
subquestion: "You must be 18 or older to complete this form."
---
id: users names
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix
question: |
  % if i == 0 and al_person_answering == "user":
  What is your name?
  % elif al_form_type in ['starts_case', 'existing_case', 'appeal']:
  Who is the ${ ordinal(i) } person on your side of the case?
  % else:
  What is the name of the ${ ordinal(i) } person who is adding their
  name to this form with you?
  % endif
fields:
  - code: |
      users[i].name_fields()
---
id: Caregiver Information
question: |
  Caregiver Information
fields:
  - "What's your full address?": users1_address_full
  - "What's your ID number? (Use only one: Driver's License, Consular Card, Medi-Cal, or Social Security)": users1_id_number
  - Signature Date?: users1_signature_date
    datatype: date
subquestion: "The caregiver is the person filling out this form and will be watching the child."
---
id: Minor Information
question: "Advised Parents?"
subquestion: "Were you able to speak with at least one parent? Were you unable to contact one or both parents?"
fields:
  - You advised at least one parent.: users_advised_parents_yes
    datatype: yesno
  - You were unable to contact one or both parents.: users_unable_to_contact_parents_yes
    datatype: yesno
---
comment: |
  The questions below are copies of the questions in AssemblyLine's
  ql_baseline.yml, rewritten to name this interview's own objects instead of the
  generic `x`. Edit them freely: they replace the AssemblyLine versions. Delete
  one to go back to the AssemblyLine wording.
---
id: Minor Info1
question: "Child's Information"
fields:
  - Are you related to the child?: users_is_relative_yes
    datatype: yesnoradio
---
id: children names
sets:
  - children[i].name.first
  - children[i].name.last
  - children[i].name.middle
  - children[i].name.suffix
question: |
  % if hasattr(children, 'ask_number') and children.ask_number and children.target_number == 1:
  Name of child
  % else:
  Name of the ${ ordinal(i) } child
  % endif
fields:
  - code: |
      children[i].name_fields()
---
id: preview caregiver_authorization_affidavit_form_finalwithfields
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.

  ${ al_court_bundle.as_pdf(key='preview') }

  Open the form preview in a new tab. Use the "Edit answers" button to edit your
  answers.

  ${ action_button_html(url_action('review_caregiver_authorization_affidavit_form_finalwithfields'), label=word('Edit answers'), color='info') }

  Return to this interview tab to continue and sign your form.
continue button field: caregiver_authorization_affidavit_form_finalwithfields_preview_question
---
code: |
  signature_fields = ['users[0].signature']
---
code: |
  # This is a placeholder for the addresses that will be searched
  # for matching address to court. Edit if court venue is based on
  # a different address than the user's
  [user.address.address for user in users.complete_elements()]
  addresses_to_search = [user.address for user in users.complete_elements()]
---
id: caregiver authorization affidavit form finalwithfields review screen
event: review_caregiver_authorization_affidavit_form_finalwithfields
question: |
  Review your answers
review:
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: users1_address_full
    button: |
      **Caregiver Information**

      Full address of the caregiver: ${ showifdef('users1_address_full') }

      Caregiver's ID or license number: ${ showifdef('users1_id_number') }

      Date caregiver signed affidavit: ${ showifdef('users1_signature_date') }
  - Edit: users_is_relative_yes
    button: |
      **Minor Information**

      Caregiver is a relative of minor: ${ word(yesno(users_is_relative_yes)) if defined('users_is_relative_yes') else '' }

      Caregiver advised legal guardians: ${ word(yesno(users_advised_parents_yes)) if defined('users_advised_parents_yes') else '' }

      Caregiver unable to contact guardians: ${ word(yesno(users_unable_to_contact_parents_yes)) if defined('users_unable_to_contact_parents_yes') else '' }
  - Edit: children.revisit
    button: |
      **Children**

      % for item in children:
        * ${ item }
      % endfor
  - Edit: users1_address_full
    button: |
      **Full address of the caregiver**

      Full address of the caregiver: ${ showifdef('users1_address_full') }
  - Edit: users1_id_number
    button: |
      **Caregiver's ID or license number**

      Caregiver's ID or license number: ${ showifdef('users1_id_number') }
  - Edit: users1_signature_date
    button: |
      **Date caregiver signed affidavit**

      Date caregiver signed affidavit: ${ showifdef('users1_signature_date') }
  - Edit: users_is_relative_yes
    button: |
      **Caregiver is a relative of minor**

      Caregiver is a relative of minor: ${ word(yesno(users_is_relative_yes)) if defined('users_is_relative_yes') else '' }
  - Edit: users_advised_parents_yes
    button: |
      **Caregiver advised legal guardians**

      Caregiver advised legal guardians: ${ word(yesno(users_advised_parents_yes)) if defined('users_advised_parents_yes') else '' }
  - Edit: users_unable_to_contact_parents_yes
    button: |
      **Caregiver unable to contact guardians**

      Caregiver unable to contact guardians: ${ word(yesno(users_unable_to_contact_parents_yes)) if defined('users_unable_to_contact_parents_yes') else '' }
---
id: edit users
continue button field: users.revisit
question: |
  Edit users
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
table: users.table
rows: users
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Birthdate: |
      row_item.birthdate if defined("row_item.birthdate") else ""
  - Signature: |
      row_item.signature if defined("row_item.signature") else ""
edit:
  - name.first
  - birthdate
confirm: True
---
id: edit children
continue button field: children.revisit
question: |
  Edit children
subquestion: |
  ${ children.table }

  ${ children.add_action() }
---
table: children.table
rows: children
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Birthdate: |
      row_item.birthdate if defined("row_item.birthdate") else ""
edit:
  - name.first
  - birthdate
confirm: True
---
id: download caregiver_authorization_affidavit_form_finalwithfields
event: caregiver_authorization_affidavit_form_finalwithfields_download
question: |
  All done
subquestion: |2
  Thank you ${users}. Your form is ready to download and send.
  
  Use the options on this page to view, download and send your form. Use the
  "Edit answers" button to fix any mistakes.
  
  ${ action_button_html(url_action('review_caregiver_authorization_affidavit_form_finalwithfields'), label=word('Edit answers'), color='info') }
  
  ${ al_user_bundle.download_list_html() }
  
  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }
progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - caregiver_authorization_affidavit_form_finalwithfields_Post_interview_instructions: ALDocument.using(filename="caregiver_authorization_affidavit_form_finalwithfields_next_steps.docx", enabled=al_next_steps_enabled, has_addendum=False)
  - caregiver_authorization_affidavit_form_finalwithfields_attachment: ALDocument.using(filename="caregiver_authorization_affidavit_form_finalwithfields", enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[caregiver_authorization_affidavit_form_finalwithfields_Post_interview_instructions, caregiver_authorization_affidavit_form_finalwithfields_attachment], filename="caregiver_authorization_affidavit_form_finalwithfields", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[caregiver_authorization_affidavit_form_finalwithfields_attachment], filename="caregiver_authorization_affidavit_form_finalwithfields", enabled=True)
---
template: caregiver_authorization_affidavit_form_finalwithfields_Post_interview_instructions.title
content: |
  Instructions
---
template: caregiver_authorization_affidavit_form_finalwithfields_attachment.title
content: |
  Caregiver Authorization Affidavit Form final-with-fields
---
template: al_user_bundle.title
content: |
  All forms to download for your records
---
template: al_court_bundle.title
content: |
  All forms to deliver to court
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: caregiver_authorization_affidavit_form_finalwithfields_next_steps
  docx template file: caregiver_authorization_affidavit_form_finalwithfields_next_steps.docx
  variable name: caregiver_authorization_affidavit_form_finalwithfields_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: caregiver authorization affidavit form finalwithfields
  filename: caregiver_authorization_affidavit_form_finalwithfields
  variable name: caregiver_authorization_affidavit_form_finalwithfields_attachment[i]
  skip undefined: True
  pdf template file: Caregiver_Authorization_Affidavit_Form_final-with-fields.pdf
  fields:
      - "children1_name_full": ${ children[0] }
      - "children1_birthdate": ${ children[0].birthdate.format() }
      - "users1_name_full": ${ users[0] }
      - "users1_address_full": ${ users1_address_full }
      - "users_is_relative_yes": ${ users_is_relative_yes }
      - "users_advised_parents_yes": ${ users_advised_parents_yes }
      - "users_unable_to_contact_parents_yes": ${ users_unable_to_contact_parents_yes }
      - "users1_birthdate": ${ users[0].birthdate.format() }
      - "users1_id_number": ${ users1_id_number }
      - "users1_signature": ${ users[0].signature_if_final(i) }
      - "users1_signature_date": ${ users1_signature_date.format() }

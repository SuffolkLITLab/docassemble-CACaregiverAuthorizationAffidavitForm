#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_caregiver_authorization_affidavit_form_finalwithfields
code: |
  # 1. Ask caregiver age qualification gate
  user_age
  # If caregiver answered 'No' (user_age is False), trigger the caregiver off-ramp screen
  if not user_age:
    under_18_offramp
  # 2. Ask whether they are the Parent/Legal Guardian or Authorized Caregiver
  user_role_type
  user_ask_role
  nav.set_section('people')
  users.gather()
  set_parts(subtitle=str(users))
  # Gathers Question Library address with Google Maps autocomplete
  users[0].address.address
  # Formats Question Library address into single-line string for PDF template
  users1_address_full = users[0].address.on_one_line()
  users[0].birthdate
  # Dedicated standalone ID question screen with dynamic dropdown and tailored length textbox
  caregiver_id_type
  users1_id_number
  users_is_relative_yes
  # Triggers the parental notification logic (automatic for Parent/Legal Guardian, yes/no radio for authorized caregiver)
  users_advised_parents_yes
  nav.set_section('case_details')
  set_progress(45)
  children.gather()
  # Gather child's birthdate
  children[0].birthdate
  # 3. Child age check: If child is 18 or older from the date the form is being filled, trigger off-ramp
  if children[0].age_in_years() >= 18:
    child_too_old_offramp
  interview_order_caregiver_authorization_affidavit_form_finalwithfields = True
